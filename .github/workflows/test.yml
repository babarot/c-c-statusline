name: Test

# On main, Release runs this before it releases
on:
  pull_request:
    # What tagpr's pull request changes, released only once this passes on
    # main; its runs wait for an approval anyway, made with GITHUB_TOKEN
    paths-ignore:
      - CHANGELOG.md
      - src/version.ts
      - deno.json
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - run: deno task test
