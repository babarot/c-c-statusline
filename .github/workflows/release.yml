name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}

jobs:
  test:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  # Nothing is released, nor the pull request of the next release made,
  # from a main that fails the tests
  tagpr:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run tagpr
        uses: Songmu/tagpr@7ebae2dcc300132baa7cc9dd108c8923b07fc366 # v1.20.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        id: run-tagpr
    outputs:
      tag: ${{ steps.run-tagpr.outputs.tag }}

  build:
    if: needs.tagpr.outputs.tag != ''
    needs: tagpr
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Compile binaries
        run: |
          mkdir -p dist
          deno task compile:macos-arm
          deno task compile:macos-x86
          deno task compile:linux-arm
          deno task compile:linux-x86

      - name: Generate checksums
        run: |
          cd dist
          sha256sum -- c-c-statusline-* > checksums.txt
          cat checksums.txt

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.tagpr.outputs.tag }}" dist/* --clobber

  publish-nix:
    if: needs.tagpr.outputs.tag != ''
    needs: [tagpr, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Publish Nix package to babarot/nur-packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUR_GITHUB_TOKEN: ${{ secrets.NUR_GITHUB_TOKEN }}
          TAG: ${{ needs.tagpr.outputs.tag }}
        run: |
          gh release download "$TAG" -p checksums.txt -D "$RUNNER_TEMP"
          nur="$RUNNER_TEMP/nur-packages"
          git clone --depth 1 "https://x-access-token:${NUR_GITHUB_TOKEN}@github.com/babarot/nur-packages.git" "$nur"

          file="$nur/pkgs/c-c-statusline/default.nix"
          prev=$(sed -n 's/^  version = "\(.*\)";$/\1/p' "$file" 2>/dev/null || true)
          mkdir -p "$(dirname "$file")"
          .github/scripts/nix-derivation.sh "$TAG" "$RUNNER_TEMP/checksums.txt" > "$file"

          cd "$nur"
          git add pkgs/c-c-statusline
          if git diff --cached --quiet; then
            echo "nothing to publish"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "c-c-statusline: ${prev:+$prev -> }$TAG"
          git push
